name: Build EXE and Release

on:
  workflow_dispatch:  # For manual trigger from GitHub Actions UI
  push:
    tags:
      - "v*.*.*"  # Triggers when a tag like v1.0.0 is pushed

jobs:
  build:
    runs-on: windows-latest  # Use Windows to compile the EXE
    permissions:
      contents: write  # This allows GitHub Actions to create releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.11"

      - name: Install Dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Build EXE using .spec file
        run: |
          .venv\Scripts\activate
          pyinstaller pdf_splitter.spec
          Get-ChildItem -Path dist -Recurse
        shell: pwsh

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: pdf_splitter_exe
          path: ${{ github.workspace }}/dist/pdf_splitter.exe

      - name: Create GitHub Release
        id: create_release  # Add an ID to reference the upload URL
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload EXE to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/pdf_splitter/pdf_splitter.exe  # Adjust path as needed
          asset_name: pdf_splitter.exe
          asset_content_type: application/octet-stream
